spring.application.name=attendance-service
server.port=${PORT:8082}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/buzzdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

auth.service.url=http://${AUTH_SERVICE_URL:localhost:8081}
attendance.arrival.cutoff=${ATTENDANCE_ARRIVAL_CUTOFF:08:00}
jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
