spring.application.name=attendance-service
server.port=${PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/buzzdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Mybday_28}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
attendance.arrival.cutoff=${ATTENDANCE_ARRIVAL_CUTOFF:08:00}
