services:
  - type: web
    name: auth-service
    runtime: docker
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: buzz-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: buzz-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: buzz-db
          property: password
      - key: JWT_SECRET
        value: "BuzzApp2026SecretKeyForCodeQuestKNUST"
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate

  - type: web
    name: attendance-service
    runtime: docker
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: buzz-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: buzz-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: buzz-db
          property: password
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          property: hostport
      - key: JWT_SECRET
        value: "BuzzApp2026SecretKeyForCodeQuestKNUST"
      - key: ATTENDANCE_ARRIVAL_CUTOFF
        value: "08:00"
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate

  - type: web
    name: safety-service
    runtime: docker
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: buzz-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: buzz-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: buzz-db
          property: password
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          property: hostport
      - key: JWT_SECRET
        value: "BuzzApp2026SecretKeyForCodeQuestKNUST"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate

databases:
  - name: buzz-db
    plan: free
    databaseName: buzzdb
