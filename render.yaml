services:
  - type: web
    name: auth-service
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    initialStartupDelay: 180
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: buzz-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: buzz-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: buzz-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
    healthCheckPath: /actuator/health

  - type: web
    name: attendance-service
    runtime: docker
    dockerfilePath: ./attendance-service/Dockerfile
    initialStartupDelay: 180
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: buzz-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: buzz-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: buzz-db
          property: password
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          property: hostport
      - key: ATTENDANCE_ARRIVAL_CUTOFF
        value: "08:00"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
    healthCheckPath: /actuator/health

  - type: web
    name: safety-service
    runtime: docker
    dockerfilePath: ./safety-service/Dockerfile
    initialStartupDelay: 180
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: buzz-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: buzz-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: buzz-db
          property: password
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          property: hostport
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
    healthCheckPath: /actuator/health

databases:
  - name: buzz-db
    plan: free
    databaseName: buzzdb
