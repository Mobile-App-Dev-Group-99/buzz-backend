services:

  postgres:
    image: postgres:15
    container_name: buzz-postgres
    environment:
      POSTGRES_DB: buzzdb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - buzz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d buzzdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - buzz-net

  flyway:
    image: redgate/flyway:11.13.2
    container_name: buzz-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/buzzdb
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "9"
    volumes:
      - ../buzz-database/db/migration:/flyway/sql:ro
    command: migrate
    networks:
      - buzz-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/buzzdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - buzz-net

  attendance-service:
    build:
      context: ./attendance-service
      dockerfile: Dockerfile
    container_name: attendance-service
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/buzzdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      AUTH_SERVICE_URL: http://auth-service:8081
      ATTENDANCE_ARRIVAL_CUTOFF: "08:00"
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    networks:
      - buzz-net

  safety-service:
    build:
      context: ./safety-service
      dockerfile: Dockerfile
    container_name: safety-service
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/buzzdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      AUTH_SERVICE_URL: http://auth-service:8081
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    networks:
      - buzz-net

networks:
  buzz-net:
    driver: bridge

volumes:
  buzz_pg_data:
