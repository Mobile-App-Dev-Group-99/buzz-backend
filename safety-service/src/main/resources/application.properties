spring.application.name=safety-service
server.port=${PORT:8083}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/buzzdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

auth.service.url=http://${AUTH_SERVICE_URL:localhost:8081}
jwt.secret=${JWT_SECRET:BuzzApp2026SecretKeyForCodeQuestKNUST}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.school.name=${APP_SCHOOL_NAME:BuzzApp}

# SMS (AfricanTalking)
sms.username=${SMS_USERNAME:}
sms.apiKey=${SMS_API_KEY:}
sms.senderId=${SMS_SENDER_ID:}
